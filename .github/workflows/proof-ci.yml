name: Crypto Forecaster Proof CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof-layer dependencies
        run: python -m pip install numpy pandas
      - name: Syntax check
        run: python -m py_compile forecast_proof.py repair_proof_local.py crypto_forecaster_ultimate.py cloud_server.py scripts/export_pages_data.py
      - name: Static exporter import check
        run: python -c "import runpy; runpy.run_path('scripts/export_pages_data.py', run_name='proof_import_check')"
      - name: Proof ledger smoke test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          import pandas as pd
          import forecast_proof

          with tempfile.TemporaryDirectory() as td:
              out = Path(td)
              latest = pd.DataFrame([{
                  "date": "2026-09-01",
                  "coin": "BTC",
                  "horizon": 7,
                  "model": "META",
                  "current_price": 100.0,
                  "prob_up": 0.70,
                  "pred_ret": 0.10,
                  "low80": -0.05,
                  "high80": 0.20,
                  "expected_price": 110.0,
                  "low80_price": 95.0,
                  "high80_price": 120.0,
                  "confidence_score": 0.80,
                  "ood_fraction": 0.01,
                  "expert_disagreement": 0.02,
              }])

              first = forecast_proof.record_forecasts(out, latest)
              second = forecast_proof.record_forecasts(out, latest)
              assert first["added"] == 1
              assert second["added"] == 0

              prices = pd.DataFrame(
                  {"BTC_close": [100.0, 105.0, 111.0]},
                  index=pd.to_datetime(["2026-09-01", "2026-09-07", "2026-09-08"]),
              )
              results = forecast_proof.evaluate_ledger(out, prices)
              summary = forecast_proof.build_summary(out, prices)
              assert len(results) == 1
              assert summary["resolvedTotal"] == 1
              assert bool(results.iloc[0]["direction_correct"]) is True
          PY
      - name: Local recovery integrity test
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, datetime, time, timedelta, timezone
          from pathlib import Path
          import os
          import subprocess
          import sys
          import tempfile
          import pandas as pd

          with tempfile.TemporaryDirectory() as td:
              data = Path(td)
              out = data / "ultimate_run" / "output"
              out.mkdir(parents=True)

              today = date.today()
              yesterday = today - timedelta(days=1)
              too_old = today - timedelta(days=2)
              rows = [
                  {
                      "date": str(yesterday),
                      "coin": "BTC",
                      "horizon": 1,
                      "model": "META",
                      "current_price": 100.0,
                      "prob_up": 0.55,
                      "pred_ret": 0.01,
                      "low80": -0.03,
                      "high80": 0.04,
                  },
                  {
                      "date": str(too_old),
                      "coin": "ETH",
                      "horizon": 1,
                      "model": "META",
                      "current_price": 100.0,
                      "prob_up": 0.55,
                      "pred_ret": 0.01,
                      "low80": -0.03,
                      "high80": 0.04,
                  },
              ]
              latest_path = out / "latest_forecasts.csv"
              pd.DataFrame(rows).to_csv(latest_path, index=False)

              evidence_time = datetime.combine(today, time(hour=6), tzinfo=timezone.utc)
              ts = evidence_time.timestamp()
              os.utime(latest_path, (ts, ts))

              subprocess.run([sys.executable, "repair_proof_local.py", str(data)], check=True)
              ledger = pd.read_csv(out / "forecast_ledger.csv")
              assert len(ledger) == 1
              assert ledger.iloc[0]["forecast_date"] == str(yesterday)
              assert ledger.iloc[0]["coin"] == "BTC"
              assert str(ledger.iloc[0]["issued_at_utc"]).startswith(str(today))
          PY
